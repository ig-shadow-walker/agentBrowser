[package]
name = "agentbrowser-app"
version = "0.1.2"
description = "Menu bar control panel for agentBrowser"
authors = ["Aryan Behzadi"]
edition = "2021"

[lib]
# The `_lib` suffix keeps the library name distinct from the binary name.
name = "agentbrowser_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
# A menu bar utility should be small; these cost build time, not runtime.
codegen-units = 1
lto = true
opt-level = "s"
strip = true
