<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>agentBrowser</title>
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body>
    <main class="panel">
      <header class="header">
        <h1>agentBrowser</h1>
        <span class="version" id="version"></span>
      </header>

      <div class="status" id="status">
        <span class="dot" id="status-dot"></span>
        <span id="status-text">Checking…</span>
      </div>

      <section class="section">
        <h2>Credentials</h2>
        <p class="hint">
          Typed straight into the page by the engine. Your agent only ever sees
          the name.
        </p>

        <form class="add" id="add-form" autocomplete="off">
          <input
            id="secret-name"
            type="text"
            placeholder="MY_APP_PASSWORD"
            spellcheck="false"
            autocapitalize="characters"
            aria-label="Credential name"
          />
          <input
            id="secret-value"
            type="password"
            placeholder="value"
            aria-label="Credential value"
          />
          <button type="submit" id="add-button">Save</button>
        </form>

        <p class="error" id="error" hidden></p>

        <ul class="list" id="list"></ul>
        <p class="empty" id="empty" hidden>No credentials stored yet.</p>
      </section>

      <footer class="footer">
        Claude Code and Codex run the browser themselves — closing this window
        changes nothing.
      </footer>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
